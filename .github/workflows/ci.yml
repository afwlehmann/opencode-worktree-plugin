name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          flakehub: false
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop --command npm ci
      - run: nix develop --command sh -c 'npx eslint . && npx prettier --check .'
      - run: nix develop --command npx tsc --noEmit
      - run: nix develop --command npx vitest run --exclude src/integration.test.ts
      - run: nix develop --command npx vite build
      - run: nix develop --command nix build .#default --print-build-logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
